<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dear You Gifting SA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbee4c">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#fbee4c;--r:#d62f1f;--ink:#1a1a1a;--mut:#6b6b70;--bg:#f2f2f5;--card:#fff;--line:#e2e2e8}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
header{background:var(--y);padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:46px;height:46px;border-radius:12px}
header b{flex:1;font-size:19px;line-height:1.15}
.hb{background:#fff;border:0;border-radius:12px;padding:8px 12px;font:inherit;font-weight:700}
main{padding:14px;max-width:720px;margin:auto;padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--r);color:#fff;margin-bottom:8px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600}
.chip.on{background:var(--y);border-color:var(--ink)}
.pimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#eee}
.desc{white-space:pre-wrap;color:#333;margin:8px 0;line-height:1.5}
.price{font-size:22px;font-weight:700;color:var(--r)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:15px}
.oimg{width:100%;max-height:380px;object-fit:contain;border-radius:12px;background:#f6f6f8;margin:8px 0}
.big{font-size:30px;font-weight:700;line-height:1.2}
.bigl{font-size:22px;font-weight:700;margin:6px 0}
.pill{display:inline-block;background:var(--y);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px}
.wa{position:fixed;right:14px;bottom:14px;background:#25d366;color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:13px 20px;z-index:6}
.toast{position:fixed;left:14px;right:14px;bottom:80px;background:var(--ink);color:#fff;padding:14px;border-radius:12px;z-index:9}
h2{margin:6px 0 12px}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <b>Dear You<br>Gifting SA</b>
  <button class="hb" onclick="go('login')">👤</button>
  <button class="hb" onclick="go('cart')">🛒 <span id="cc">0</span></button>
</header>
<main id="app"></main>
<a class="wa" id="wa" target="_blank" rel="noopener">💬 WhatsApp</a>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== কনফিগ: পুরোনো index.html থেকে এই দুটো কপি করুন (Supabase → Settings → API) ===== */
const SB_URL = 'https://yiewhwcobngvscavalrv.supabase.co';
const SB_KEY = 'sb_publishable_I4dZabE4EjWbsWW75fZGSA_Ff_2-8VH';
const WHATSAPP = '966593481426';            // আপনার WhatsApp নম্বর (দেশ কোডসহ, + ছাড়া)
const DELIVERY = { 'Riyadh': 550 };         // শহর অনুযায়ী ডেলিভারি চার্জ (৳)
const ADVANCE_PCT = 50;

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk = n => '৳' + Math.round(+n || 0).toLocaleString('en-US');
const S = { view:'home', products:[], cart:JSON.parse(sessionStorage.getItem('cart') || '[]'), user:null, staff:false, cat:'All', orders:[], rep:'first', month:'all' };

function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; setTimeout(()=>t.hidden=true,3500); }
function saveCart(){ sessionStorage.setItem('cart', JSON.stringify(S.cart)); $('#cc').textContent = S.cart.reduce((a,c)=>a+c.qty,0); }
$('#wa').href = 'https://wa.me/' + WHATSAPP;

async function init(){
  saveCart();
  const { data:{ session } } = await sb.auth.getSession();
  await setUser(session?.user);
  const { data, error } = await sb.from('products').select('*').order('id');
  if (error) toast('প্রোডাক্ট লোড হয়নি: ' + error.message);
  S.products = data || [];
  go('home');
}
async function setUser(u){
  S.user = u || null; S.staff = false;
  if (u) { const { data } = await sb.from('staff').select('user_id').eq('user_id', u.id).maybeSingle(); S.staff = !!data; }
}
function go(v){ S.view = v; render(); window.scrollTo(0,0); }
function render(){ ({home,cart,login,orders,report}[S.view] || home)(); }

/* ===== হোম: প্রোডাক্ট ও বিবরণ ===== */
function home(){
  const cats = ['All', ...new Set(S.products.map(p => p.category).filter(Boolean))];
  const list = S.products.filter(p => S.cat === 'All' || p.category === S.cat);
  $('#app').innerHTML = `
    <div class="chips">${cats.map(c => `<button class="chip ${c===S.cat?'on':''}" onclick="S.cat='${esc(c)}';home()">${esc(c)}</button>`).join('')}</div>
    ${list.map(p => `
      <div class="card">
        ${p.image ? `<img class="pimg" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : ''}
        <div class="row" style="margin-top:8px"><b style="font-size:19px">${esc(p.name)}</b><span class="price">${tk(p.price)}</span></div>
        <div class="desc">${esc(p.description || 'বিস্তারিত শিগগির যোগ হবে।')}</div>
        <select id="sz${p.id}"><option>S</option><option selected>M</option><option>L</option></select>
        <button class="btn" onclick="add(${p.id})">কার্টে যোগ করুন</button>
      </div>`).join('') || '<p class="mut">কোনো প্রোডাক্ট নেই।</p>'}`;
}
function add(id){
  const p = S.products.find(x => x.id === id), size = $('#sz'+id).value;
  const f = S.cart.find(c => c.id === id && c.size === size);
  if (f) f.qty++; else S.cart.push({ id, name:p.name, size, qty:1, price:+p.price, cost:+p.cost || 0, image:p.image || '', description:p.description || '' });
  saveCart(); toast('কার্টে যোগ হয়েছে ✔');
}

/* ===== কার্ট ও চেকআউট ===== */
function cart(){
  if (!S.cart.length) { $('#app').innerHTML = '<div class="card"><h2>কার্ট খালি</h2><button class="btn" onclick="go(\'home\')">প্রোডাক্ট দেখুন</button></div>'; return; }
  $('#app').innerHTML = `<h2>আপনার কার্ট</h2>
    ${S.cart.map((c,i) => `<div class="card">
      ${c.image ? `<img class="oimg" src="${esc(c.image)}" alt="">` : ''}
      <b>${esc(c.name)}</b> · ${esc(c.size)}
      <div class="desc">${esc(c.description)}</div>
      <div class="row"><span class="price">${tk(c.price*c.qty)}</span>
        <span><button class="chip" onclick="qty(${i},-1)">−</button> <b>${c.qty}</b> <button class="chip" onclick="qty(${i},1)">+</button></span></div></div>`).join('')}
    <div class="card"><h2>ডেলিভারির তথ্য</h2>
      <input id="rn" placeholder="গ্রহীতার নাম"><input id="rp" placeholder="গ্রহীতার মোবাইল" inputmode="tel">
      <input id="cn" placeholder="আপনার নাম"><input id="cp" placeholder="আপনার মোবাইল" inputmode="tel">
      <select id="co"><option value="SA">সৌদি আরব</option><option value="BD">বাংলাদেশ</option></select>
      <input id="ci" placeholder="শহর (যেমন Riyadh)" oninput="sum()"><input id="ad" placeholder="ঠিকানা">
      <input id="dd" type="date"><textarea id="nt" rows="2" placeholder="কার্ডে কী লেখা হবে / বিশেষ নির্দেশ"></textarea>
      <input id="bk" placeholder="bKash নম্বর"><input id="tx" placeholder="TrxID">
      <div id="sm" class="mut"></div><button class="btn" onclick="place()">অর্ডার কনফার্ম করুন</button></div>`;
  sum();
}
function qty(i,d){ S.cart[i].qty += d; if (S.cart[i].qty < 1) S.cart.splice(i,1); saveCart(); cart(); }
function totals(){
  const items = S.cart.reduce((a,c) => a + c.price*c.qty, 0);
  const del = DELIVERY[($('#ci')?.value || '').trim()] || 0;
  const total = items + del, adv = Math.round(total * ADVANCE_PCT / 100);
  return { items, del, total, adv, due: total - adv };
}
function sum(){ const t = totals(); $('#sm').innerHTML = `ডেলিভারি চার্জ: <b>${tk(t.del)}</b><br>মোট: <b>${tk(t.total)}</b><br>এখন অগ্রিম (${ADVANCE_PCT}%): <b>${tk(t.adv)}</b> · ডেলিভারিতে বাকি: <b>${tk(t.due)}</b>`; }
async function place(){
  if (!S.user) { toast('অর্ডারের আগে লগইন করুন'); return go('login'); }
  const v = id => $('#'+id).value.trim(), t = totals();
  if (!v('rn') || !v('rp') || !v('ad') || !v('tx')) return toast('নাম, মোবাইল, ঠিকানা ও TrxID দিন');
  const row = { user_id:S.user.id, customer_name:v('cn'), customer_phone:v('cp'), receiver_name:v('rn'), receiver_phone:v('rp'),
    country:v('co'), city:v('ci'), address:v('ad'), delivery_date:v('dd') || null, note:v('nt'),
    items:S.cart, total:t.total, delivery_charge:t.del, advance:t.adv, due:t.due, bkash_number:v('bk'), trx_id:v('tx'), status:'নতুন' };
  const { error } = await sb.from('gift_orders').insert(row);
  if (error) return toast('অর্ডার হয়নি: ' + error.message);
  S.cart = []; saveCart(); toast('অর্ডার জমা হয়েছে ✔'); go('orders');
}

/* ===== লগইন (শুধু ইমেইল ও পাসওয়ার্ড) ===== */
function login(){
  if (S.user) { $('#app').innerHTML = `<div class="card"><h2>আপনি লগইন আছেন</h2><p class="mut">${esc(S.user.email)}</p>
    <button class="btn" onclick="go('orders')">আমার অর্ডার</button>${S.staff ? '<button class="btn" onclick="go(\'report\')">রিপোর্ট</button>' : ''}
    <button class="btn alt" onclick="out()">লগআউট</button></div>`; return; }
  $('#app').innerHTML = `<div class="card"><h2>লগইন</h2>
    <input id="em" type="email" placeholder="Email (Gmail)"><input id="pw" type="password" placeholder="Password (6+ অক্ষর)">
    <button class="btn" onclick="auth(0)">লগইন</button><button class="btn alt" onclick="auth(1)">অ্যাকাউন্ট খুলুন</button>
    <button class="btn alt" onclick="reset()">🔑 পাসওয়ার্ড ভুলে গেছেন?</button></div>`;
}
async function auth(signup){
  const email = $('#em').value.trim(), password = $('#pw').value;
  const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error) return toast(error.message);
  await setUser(data.user || (await sb.auth.getUser()).data.user);
  toast(signup ? 'অ্যাকাউন্ট তৈরি হয়েছে' : 'লগইন সফল'); go(S.cart.length ? 'cart' : 'home');
}
async function reset(){ const e = $('#em').value.trim(); if (!e) return toast('আগে ইমেইল লিখুন'); const { error } = await sb.auth.resetPasswordForEmail(e); toast(error ? error.message : 'ইমেইলে রিসেট লিংক গেছে'); }
async function out(){ await sb.auth.signOut(); await setUser(null); go('home'); }

/* ===== অর্ডার (কনফার্ম অর্ডারে বড় ছবি) ===== */
async function orders(){
  if (!S.user) return go('login');
  $('#app').innerHTML = '<p class="mut">লোড হচ্ছে…</p>';
  let q = sb.from('gift_orders').select('*').order('created_at', { ascending:false });
  if (!S.staff) q = q.eq('user_id', S.user.id);
  const { data, error } = await q; if (error) return toast(error.message);
  S.orders = data || [];
  $('#app').innerHTML = `<h2>${S.staff ? 'সব অর্ডার' : 'আমার অর্ডার'}</h2>` + (S.orders.map(o => `<div class="card">
    <span class="pill">${esc(o.status)}</span> <span class="mut">${esc((o.created_at||'').slice(0,10))}</span>
    <div class="bigl">🎁 ${esc(o.receiver_name)} · ${esc(o.receiver_phone)}</div>
    <div>📍 ${esc(o.city)} ${esc(o.address)}</div><div>📅 ডেলিভারি: <b>${esc(o.delivery_date || '-')}</b></div>
    ${o.note ? `<div>📝 ${esc(o.note)}</div>` : ''}
    ${(o.items||[]).map(i => `${i.image ? `<img class="oimg" src="${esc(i.image)}" alt="">` : ''}<div><b>${esc(i.name)}</b> ${esc(i.size)} ×${i.qty}</div>`).join('')}
    <div class="mut" style="margin-top:8px">ডেলিভারি চার্জ: ${tk(o.delivery_charge)}</div>
    <div>অগ্রিম: <b>${tk(o.advance)}</b> · বাকি: <b>${tk(o.due)}</b></div>
    <div class="mut">bKash ${esc(o.bkash_number)} · TrxID ${esc(o.trx_id)}</div>
    ${S.staff ? `<select onchange="setSt(${o.id},this.value)">${['নতুন','কনফার্ম','ডেলিভারি হয়েছে','বাতিল'].map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn alt" onclick="del(${o.id})">🗑 অর্ডার মুছুন</button>` : ''}</div>`).join('') || '<p class="mut">কোনো অর্ডার নেই।</p>');
}
async function setSt(id, status){ const { error } = await sb.from('gift_orders').update({ status }).eq('id', id); toast(error ? error.message : 'আপডেট হয়েছে'); }
async function del(id){ if (!confirm('অর্ডার মুছবেন?')) return; await sb.from('gift_orders').delete().eq('id', id); orders(); }

/* ===== রিপোর্ট: প্রতিটি আলাদা বড় ফিল্টার ===== */
async function report(){
  if (!S.staff) return go('home');
  const [o, p, e] = await Promise.all([ sb.from('gift_orders').select('*'), sb.from('purchases').select('*'), sb.from('expenses').select('*') ]);
  S.R = { o:(o.data||[]).filter(x => x.status !== 'বাতিল'), p:p.data||[], e:e.data||[] };
  drawReport();
}
function drawReport(){
  const { o, p, e } = S.R, mo = x => (x.created_at || '').slice(0,7), dy = x => (x.created_at || '').slice(0,10);
  const months = [...new Set(o.map(mo))].sort().reverse();
  const inM = x => S.month === 'all' || mo(x) === S.month;
  const O = o.filter(inM), P = p.filter(inM), E = e.filter(inM);
  const sell = x => (x.items||[]).reduce((a,i) => a + i.price*i.qty, 0);
  const cost = x => (x.items||[]).reduce((a,i) => a + (i.cost||0)*i.qty, 0);
  const sum = (a,f) => a.reduce((s,x) => s + (+f(x) || 0), 0);
  const tabs = [['first','প্রথম পেমেন্ট'],['due','ডিউ পেমেন্ট'],['daily','ডেইলি সেল'],['buy','প্রোডাক্ট ক্রয়'],['profit','মাসিক লাভ']];
  let body = '';
  if (S.rep === 'first') body = `<div class="big">${tk(sum(O, x => x.advance))}</div><div class="mut">${O.length} অর্ডারের অগ্রিম</div>`;
  if (S.rep === 'due') body = `<div class="big">${tk(sum(O.filter(x => x.status !== 'ডেলিভারি হয়েছে'), x => x.due))}</div><div class="mut">ডেলিভারিতে আদায় বাকি</div>`;
  if (S.rep === 'daily') { const d = {}; O.forEach(x => d[dy(x)] = (d[dy(x)]||0) + sell(x) + (+x.delivery_charge||0)); body = Object.entries(d).sort().reverse().map(([k,v]) => `<div class="row card"><span class="bigl">${k}</span><span class="bigl">${tk(v)}</span></div>`).join('') || '<p class="mut">ডেটা নেই</p>'; }
  if (S.rep === 'buy') body = `<div class="big">${tk(sum(P, x => x.amount))}</div><div class="mut">${P.length} টি ক্রয়</div>`;
  if (S.rep === 'profit') { const s = sum(O, sell), c = sum(O, cost), x = sum(E, y => y.amount), net = s - c - x;
    body = `<div class="bigl">বিক্রি: ${tk(s)}</div><div class="bigl">প্রোডাক্ট খরচ: ${tk(c)}</div><div class="bigl">নিজেদের খরচ: ${tk(x)}</div><div class="big">নিট লাভ: ${tk(net)}</div>`; }
  $('#app').innerHTML = `<h2>রিপোর্ট</h2>
    <div class="chips">${tabs.map(([k,l]) => `<button class="chip ${S.rep===k?'on':''}" style="font-size:18px" onclick="S.rep='${k}';drawReport()">${l}</button>`).join('')}</div>
    <select onchange="S.month=this.value;drawReport()"><option value="all">সব মাস</option>${months.map(m => `<option ${m===S.month?'selected':''}>${m}</option>`).join('')}</select>
    <div class="card">${body}</div>`;
}

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
